<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo - Taller de Yako y Lila</title>
    <!-- Optimización de carga (CWV / LCP) -->
    <link rel="preconnect" href="https://redcontraelabusosexual.org">
    <link rel="preload" href="./assets/material_bg.jpg" as="image" fetchpriority="high">
    <link rel="preload" href="./assets/prendas_bg.jpg" as="image" fetchpriority="high">
    <link rel="preload" href="./assets/marca_bg.jpg" as="image" fetchpriority="high">
    <link rel="preload" href="./assets/todos_bg2.jpg" as="image" fetchpriority="high">
    <link rel="stylesheet" href="./style.css?v=115">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script type="importmap">
      {
        "imports": {
          "vue": "https://unpkg.com/vue@3/dist/vue.esm-browser.js"
        }
      }
    </script>
</head>
<body>
    <div id="error-log" style="color:red; background:white; position:absolute; z-index:9999; top:0; left:0; width:100%; white-space:pre-wrap; display:none;"></div>
    <!-- Add error logging script -->
    <script>
      window.onerror = function(msg, url, lineNo, columnNo, error) {
        const errorDiv = document.getElementById('error-log');
        if (errorDiv) {
          errorDiv.style.display = 'block';
          errorDiv.innerHTML += `<p>Error: ${msg}<br>Script: ${url}<br>Line: ${lineNo}</p>`;
        }
        return false;
      };
      
      window.addEventListener('unhandledrejection', function(event) {
        const errorDiv = document.getElementById('error-log');
        if (errorDiv) {
          errorDiv.style.display = 'block';
          errorDiv.innerHTML += `<p>Promise Error: ${event.reason}</p>`;
        }
      });
    </script>
    <div id="app"></div>
    <script type="module" src="./app.js?v=32"></script>
</body>
</html>
