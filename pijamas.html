<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pijamas - Taller de Yako y Lila</title>
    <link rel="preconnect" href="https://redcontraelabusosexual.org">
    <link rel="stylesheet" href="./style.css?v=113">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script type="importmap">
      {
        "imports": {
          "vue": "https://unpkg.com/vue@3/dist/vue.esm-browser.js"
        }
      }
    <script>
      function loadMobileStyles() {
        if (window.innerWidth <= 768 || /Mobi|Android/i.test(navigator.userAgent)) {
          if (!document.querySelector('link[href^="./mobile.css"]')) {
            const link = document.createElement('link');
            link.rel = 'stylesheet';
            link.href = './mobile.css?v=2';
            document.head.appendChild(link);
          }
        } else {
          const existing = document.querySelector('link[href^="./mobile.css"]');
          if (existing) existing.remove();
        }
      }
      loadMobileStyles();
      window.addEventListener('resize', loadMobileStyles);
    </script>
</head>
<body>
    <div id="error-log" style="color:red; background:white; position:absolute; z-index:9999; top:0; left:0; width:100%; white-space:pre-wrap;"></div>
    <script>
      window.addEventListener('error', function(e) {
        document.getElementById('error-log').innerText += e.message + ' at ' + e.filename + ':' + e.lineno + '\n';
      });
      window.addEventListener('unhandledrejection', function(e) {
        document.getElementById('error-log').innerText += e.reason + '\n';
      });
      window.categoryPage = 'pijamas';
    </script>
    <div id="app"></div>
    <script type="module" src="./app.js?v=32"></script>
</body>
</html>
