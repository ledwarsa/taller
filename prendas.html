<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prendas de Vestir - Taller de Yako y Lila</title>
    <link rel="preconnect" href="https://redcontraelabusosexual.org">
    <link rel="stylesheet" href="./style.css?v=26">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script type="importmap">
      {
        "imports": {
          "vue": "https://unpkg.com/vue@3/dist/vue.esm-browser.js"
        }
      }
    </script>
</head>
<body>
    <div id="error-log" style="color:red; background:white; position:absolute; z-index:9999; top:0; left:0; width:100%; white-space:pre-wrap;"></div>
    <script>
      window.addEventListener('error', function(e) {
        document.getElementById('error-log').innerText += e.message + ' at ' + e.filename + ':' + e.lineno + '\n';
      });
      window.addEventListener('unhandledrejection', function(e) {
        document.getElementById('error-log').innerText += e.reason + '\n';
      });
      window.categoryPage = 'prendas';
    </script>
    <div id="app"></div>
    <script type="module" src="./app.js?v=30"></script>
</body>
</html>
